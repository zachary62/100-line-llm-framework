name: examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the few things the examples import
        run: pip install pyyaml numpy
      - name: Run every example against a stub model
        run: python scripts/smoke_test.py
